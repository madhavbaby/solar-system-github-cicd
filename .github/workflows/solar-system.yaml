name: solar-system cicd

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature

permissions:     #for git hub token while using WIF
  id-token: write
  contents: read



env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}


jobs:
  unit-testing:
    name: Unit Testing
    # services:
    #   mongo-db: #label
    #     image: madhavbaby/mongo-db:non-prod 
    #     ports:
    #       - 27017:27017
    #if we have env variable at both workflow and job level, the job level take higher precedence
  
    # env: 
    #   MONGO_URI: 'mongodb//localhost:27017/superData'
    #   MONGO_USERNAME: ${{ vars.NON-RPOD-MONGO_USERNAME }}
    #   MONGO_PASSWORD: ${{ secrets.NON-PROD-MONGO_PASSWORD }}

    # this i commanded bcz that image not in my docker-hub, if the image is there only need to do teh service part, other than we need to use cloud mongo
    # like production set up
   

    env:
      MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
      MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    strategy:
      matrix:
        nodejs_version: [ 18,20 ]
        operating_system: [ubuntu-latest] #mac_os
        exclude:
          - nodejs_version: 18,20
            operating_system: macos-latest
    runs-on: ${{ matrix.operating_system }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Cache NPM dependency
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependency
        run: npm install

      - name: Unit Test
        id: nodejs_unit_test
        run: npm test

      - name: Archive Test Result
        if: always() # Runs even if previous steps fail
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-00-${{ matrix.operating_system }}-${{ matrix.nodejs_version }}
          path: test-results.xml
          # overwrite: true

  docker:
    name: Containerization
    needs: [unit-testing] # Runs only after unit-testing job completes
    permissions:
      packages: write  #this for container registry package permission for push the image 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN_GITHUB }}
        
      - name: Docker Build For Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Test
        run: |
          docker images
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          
          export IP=$(docker inspect -f '{{range .Networksettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push && Container Registry Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}          
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }} 

  dev-deploy:
    needs: docker
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    runs-on: ubuntu-latest   
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1'
        with:
          create_credentials_file: true
          # workload_identity_provider: 'projects/832520843662/locations/global/workloadIdentityPools/new-git-hub-pool/providers/git-hub-new-provider'
          # service_account: 'github-pipeline-sa@training-2024-batch.iam.gserviceaccount.com'
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}
          
      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.CLUSTER_NAME }}
          location: ${{ secrets.REGION }}

      - name: Fetch Kubernetes Cluster Details
        run: |
          kubectl version
          echo ------------------------------------
          kubectl get nodes


      - name: Ensure namespace exists
        run: |
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -

      - name: Install NGINX Ingress (only if not already installed)
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          if ! helm status ingress-nginx -n ingress-nginx > /dev/null 2>&1; then
            echo "Installing NGINX Ingress in namespace ingress-nginx..."
            helm install ingress-nginx ingress-nginx/ingress-nginx \
              --namespace ingress-nginx \
              --set controller.ingressClassResource.name=nginx \
              --set controller.ingressClass=nginx
          else
            echo "NGINX Ingress already installed. Skipping installation."
          fi

      - name: Wait for LoadBalancer IP and Save to GITHUB_ENV
        run: |
          echo "Waiting for NGINX Ingress LoadBalancer IP..."
          SERVICE_NAME=ingress-nginx-controller
          NAMESPACE=ingress-nginx

          for i in {1..30}; do
            INGRESS_IP=$(kubectl get svc $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$INGRESS_IP" ]; then
              echo "LoadBalancer IP found: $INGRESS_IP"
              echo "INGRESS_IP=$INGRESS_IP" >> $GITHUB_ENV
              break
            fi
            echo "Waiting for ingress IP... ($i/30)"
            sleep 10
          done

          # Optional: show final IP if found
          kubectl get svc $SERVICE_NAME -n $NAMESPACE -o wide

      - name: Save Nginx Ingress Controller IP as a GITHUB Environment Variable
        run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> "$GITHUB_ENV"
        # This command is used to fetch ip address dynamically.
      
      - name: Replace Token in Manifest files
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '{'
          tokenSuffix: '}'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Check Files 
        run: |
          cat kubernetes/development/*.yaml


      - name: Ensure namespace exists  # or this we can specify in next step also
        run: |
          kubectl get namespace ${{ vars.NAMESPACE }} >/dev/null 2>&1 || \
          kubectl create namespace ${{ vars.NAMESPACE }}
     
     #THIS used for create the image using this secret in the deployment yaml file
      - name: Create MongoDB Secret
        run: |
          kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=${{ vars.MONGO_URI }} \
            --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
            --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f - 

      - name: Deploy Development to GKE Cluster
        run: |
          kubectl apply -f kubernetes/development -n ${{ vars.NAMESPACE }}

      - name: Set App Ingress Host URL
        id: set-ingress-host-address
        run: |
          echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> "$GITHUB_ENV"
        # This command is used to fetch ip address dynamically.


      # - name: Verify Deployment
      #   run: |
      #     kubectl -n ${{ vars.NAMESPACE }} get all
      #     kubectl -n ${{ vars.NAMESPACE }} describe deployment solar-system-deployment  
      #     kubectl -n ${{ vars.NAMESPACE }} get ingress  
      #     kubectl -n ${{ vars.NAMESPACE }} describe ingress solar-system-ingress
      #     echo "Application URL: http://${{ env.INGRESS_IP }}/solar-system/live"


  integration-testing:
    name: Dev Integration Testing
    needs: [dev-deploy] # Runs only after dev-deploy job completes
    runs-on: ubuntu-latest
    steps:
      - name: Test URL Output using CURL and JQ
        env:
          URL: {{ needs.dev-deploy.outputs.APP_INGRESS_URL}}
        run: |
          echo $URL
          echo ----------------------------------------
          curl https://$URL/live -s -k | jq -r .status | grep -i live 
          